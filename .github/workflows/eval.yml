# Fleet eval CI — push to main (public repo: unlimited free minutes).
# Eval-only gates: full NixOS module evaluation via the locked
# git+ssh nexus input (deploy-key auth) + the three assertions we
# ran by hand when closing 2.2/2.6.5. No builds — keeps runs ~3 min.
#
# NOTE: the secret is the private half of a READ-ONLY deploy key
# registered on the private erykpecyna/nexus repo (fleet repo
# secret: NEXUS_DEPLOY_KEY). Anyone with write access to this repo
# can read secrets via workflow edits — fine for a solo fleet.
name: eval
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  eval-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Install read-only nexus deploy key (git+ssh flake input)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.NEXUS_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
      - name: Eval gate — node1 toplevel evaluates through the lock
        run: |
          nix eval .#nixosConfigurations.node1.config.system.build.toplevel.drvPath >/dev/null
      - name: Eval gate — transport is iroh (2.6.5 cutover default)
        run: |
          test "$(nix eval .#nixosConfigurations.node1.config.services.nexus-node.transport)" = '"iroh"'
      - name: 'Eval gate — firewall is [22, 8080, 9464] (iroh: no grpc port)'
        run: |
          test "$(nix eval --json .#nixosConfigurations.node1.config.networking.firewall.allowedTCPPorts)" = '[22,8080,9464]'