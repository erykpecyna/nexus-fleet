# Fleet eval gates — push to main. NO SECRETS (policy: the public
# nexus-fleet repo must never hold a credential that reads/writes the
# private nexus repo). Safe since the flake has no nexus input:
# nodes run prebuilt ghcr.io/erykpecyna/nexus-node:<version> images
# (docker-only fleet) — evaluation never fetches nexus source.
#
# Eval-only by design: while the GHCR package is PRIVATE, hosted
# runners must not `docker pull` it (that would need a secret). The
# first real pull proof happens on the .213 host. When the package
# flips public, a pull-smoke job can be added.
#
# Gates double as a schema-drift tripwire for the mirror module
# (modules/nexus-node-fleet.nix) — option renames fail loudly here.
#
# Structure (since node-2, roadmap 2.5): per-node gates run as a
# matrix — every node gets the SAME six eval gates (a new node =
# one nodes/<n>.nix + one flake registration + one matrix entry).
# The fleet-topology job asserts invariants that span MORE than
# one node (exactly one standalone anchor; joiners must seed).
name: eval
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  eval-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [node1, node2]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Gate 1 — node toplevel evaluates
        run: nix eval .#nixosConfigurations.${{ matrix.node }}.config.system.build.toplevel.drvPath --raw
      - name: Gate 2 — node runs the docker (prebuilt-image) mode
        run: |
          actual=$(nix eval .#nixosConfigurations.${{ matrix.node }}.config.virtualisation.docker.enable --json)
          [ "$actual" = "true" ] || { echo "::error::virtualisation.docker.enable = $actual, expected true"; exit 1; }
      - name: Gate 3 — image is a pinned GHCR nexus-node image
        run: |
          image=$(nix eval --raw .#nixosConfigurations.${{ matrix.node }}.config.services.nexus-node.containerImage)
          case "$image" in
            ghcr.io/erykpecyna/nexus-node:*) ;;
            *) echo "::error::containerImage '$image' is not a pinned ghcr.io/erykpecyna/nexus-node:<version> image"; exit 1 ;;
          esac
          case "$image" in
            *:latest|*@latest) echo "::error::containerImage must pin an explicit version, not a mutable tag"; exit 1 ;;
          esac
          echo "image: $image"
      - name: Gate 4 — transport is iroh
        run: |
          actual=$(nix eval --raw .#nixosConfigurations.${{ matrix.node }}.config.services.nexus-node.transport)
          [ "$actual" = "iroh" ] || { echo "::error::transport = $actual, expected iroh"; exit 1; }
      - name: Gate 5 — firewall [22, 8080, 9464]
        run: |
          actual=$(nix eval --json .#nixosConfigurations.${{ matrix.node }}.config.networking.firewall.allowedTCPPorts)
          expected='[22,8080,9464]'
          [ "$actual" = "$expected" ] || { echo "::error::allowedTCPPorts = $actual, expected $expected"; exit 1; }
          echo "firewall: $actual"
      - name: Gate 6 — mgmt option surface (mirror parity tripwire)
        run: |
          actual=$(nix eval --json .#nixosConfigurations.${{ matrix.node }}.config.services.nexus-node.mgmt \
            --apply 'm: { inherit (m) enable targetPort; tokenFile = if m.tokenFile == null then null else "set"; operatorKeysFile = if m.operatorKeysFile == null then null else "set"; }')
          expected='{"enable":true,"operatorKeysFile":"set","targetPort":22,"tokenFile":"set"}'
          [ "$actual" = "$expected" ] || { echo "::error::mgmt option surface = $actual, expected $expected"; exit 1; }
          echo "mgmt: $actual"
  fleet-topology:
    # Fleet-level invariants — span MORE than one node.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Gate 7 — join topology (exactly one standalone anchor)
        # node-1 is the anchor (seed=null — a seed joins nothing);
        # every OTHER node must seed, or the fleet silently
        # fragments into standalone islands. A future re-anchor
        # changes this gate deliberately, not by accident.
        run: |
          node1_seed=$(nix eval --json .#nixosConfigurations.node1.config.services.nexus-node.seed)
          node2_seed=$(nix eval --json .#nixosConfigurations.node2.config.services.nexus-node.seed)
          [ "$node1_seed" = "null" ] || { echo "::error::node1.seed = $node1_seed — the anchor must stay standalone (seed=null)"; exit 1; }
          [ "$node2_seed" != "null" ] || { echo "::error::node2.seed is null — node-2 must join node-1"; exit 1; }
          echo "topology: node1=anchor node2=joiner"
      - name: Fleet inventory (audit echo)
        # The version-skew audit trail: what each node SHOULD run.
        run: |
          for n in node1 node2; do
            image=$(nix eval --raw .#nixosConfigurations.$n.config.services.nexus-node.containerImage)
            echo "$n: $image"
          done